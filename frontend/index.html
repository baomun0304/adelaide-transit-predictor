<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Adelaide Transit Predictor</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  :root {
    --bg:#fafafa; --panel:#ffffff; --card:#ffffff; --card2:#f4f4f5;
    --line:#e4e4e7; --text:#18181b; --muted:#71717a; --dim:#a1a1aa;
    --accent:#e11d48; --accent-ink:#ffffff; --accent2:#be123c;
    --info:#2563eb; --good:#16a34a; --warn:#d97706; --bad:#dc2626;
    --shadow-sm: 0 1px 3px rgba(24,24,27,0.06);
    --shadow-md: 0 8px 24px rgba(24,24,27,0.10);
    --radius:14px; --radius-sm:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0b1220; --panel:#111a2e; --card:#182238; --card2:#1f2b47;
      --line:#2a3752; --text:#f1f5f9; --muted:#94a3b8; --dim:#64748b;
      --accent:#fb7185; --accent-ink:#3f0d17; --accent2:#f43f5e;
      --info:#60a5fa; --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0b1220; --panel:#111a2e; --card:#182238; --card2:#1f2b47;
    --line:#2a3752; --text:#f1f5f9; --muted:#94a3b8; --dim:#64748b;
    --accent:#fb7185; --accent-ink:#3f0d17; --accent2:#f43f5e;
    --info:#60a5fa; --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.45);
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--text); font-size:14px; line-height:1.45;
         -webkit-font-smoothing: antialiased; transition: background 0.2s, color 0.2s; }

  header { padding:10px 16px; background:var(--panel); display:flex; gap:10px; align-items:center;
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { margin:0; font-size:17px; letter-spacing:-0.01em; font-weight:700; }
  header h1 .dot { display:inline-block; width:9px; height:9px; border-radius:50%;
                   background:var(--accent); margin-right:8px; vertical-align:middle;
                   box-shadow:0 0 8px var(--accent); }
  header input, header button {
    padding:10px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font: inherit; outline:none;
    min-height:40px; transition: border-color 0.15s, background 0.15s;
  }
  header input:focus { border-color: var(--accent); background:var(--panel); }
  header button { cursor:pointer; font-weight:600; white-space:nowrap; }
  header button:hover { background:var(--card); border-color:var(--accent); }
  #theme-toggle { width:40px; padding:0; display:flex; align-items:center; justify-content:center;
                  font-size:16px; flex:none; }
  #status { font-size:12px; color:var(--muted); }

  main { display:flex; height: calc(100vh - 53px); }
  #map { flex:1; }
  aside { width: 400px; padding:18px; overflow-y:auto; background:var(--panel);
          border-left:1px solid var(--line); }

  /* Mobile: sidebar becomes a bottom sheet */
  @media (max-width: 768px) {
    header { padding:10px 12px; }
    header h1 { font-size:15px; }
    header input { flex:1; min-width:0; }
    header button { padding:6px 10px; font-size:12px; }
    main { flex-direction: column; height: calc(100vh - 50px); }
    main > div:first-child { flex: 1; min-height: 200px; }
    aside { width: 100%; max-height: 55vh; border-left: none;
            border-top: 1px solid var(--line); padding: 14px; }
    .map-status { top: 8px; font-size: 11px; padding: 4px 10px; }
  }
  aside::-webkit-scrollbar { width:8px; }
  aside::-webkit-scrollbar-thumb { background:var(--card); border-radius:4px; }

  .section { margin-bottom: 22px; }
  .section h3 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase;
                color: var(--dim); letter-spacing: 0.08em; font-weight:600; }

  .stop-header { margin-bottom:16px; }
  .stop-name { font-weight:700; font-size: 19px; letter-spacing:-0.01em;
               display:flex; align-items:center; gap:8px; }
  .stop-meta { font-size:12px; color:var(--muted); margin-top:4px; }
  .star { cursor:pointer; color:var(--dim); font-size: 24px; user-select:none;
          line-height:1; transition: color 0.15s, transform 0.15s; }
  .star:hover { transform: scale(1.15); }
  .star.on { color: #f59e0b; }

  /* Arrival cards */
  .arrival {
    background: var(--card); border:1px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .arrival:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
  .a-top { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .a-route {
    background: var(--accent); color:var(--accent-ink); font-weight:700;
    padding: 4px 10px; border-radius: var(--radius-sm); font-size:13px;
    min-width: 44px; text-align:center; letter-spacing:0.01em;
  }
  .a-headsign { flex:1; font-weight:500; font-size:14px; min-width:0;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .a-time { font-variant-numeric: tabular-nums; font-weight:600; font-size:16px;
            letter-spacing:-0.01em; }

  .a-status { display:flex; align-items:center; gap:6px; font-size:13px; margin-bottom:6px; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--good);
              box-shadow:0 0 6px var(--good); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:0.45; } }
  .sched-icon { color: var(--muted); font-size:13px; }

  .a-pattern { font-size:12px; color:var(--muted); padding:6px 0;
               border-top:1px solid var(--line); margin-top:6px; }

  .a-leave {
    margin-top:8px; padding:10px 12px; background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: var(--radius-sm);
  }
  .a-leave .label { font-size:10px; text-transform:uppercase; color:var(--accent2);
                    letter-spacing:0.08em; font-weight:700; }
  .a-leave .time { font-size:18px; font-weight:700; letter-spacing:-0.01em;
                   font-variant-numeric: tabular-nums; color:var(--text); margin-top:2px; }
  .a-leave .reason { font-size:11px; color:var(--muted); margin-top:2px; }

  /* Status colors */
  .delay-on   { color:var(--good); font-weight:500; }
  .delay-late { color:var(--warn); font-weight:500; }
  .delay-bad  { color:var(--bad);  font-weight:500; }

  /* Per-route reliability cards */
  .route-card {
    background: var(--card); border:1px solid var(--line);
    border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px;
  }
  .route-card .rc-top { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .route-card .rc-label { font-weight:500; font-size:13px; }
  .route-card .rc-tip { font-size:11px; color:var(--muted); margin-top:2px; }
  .route-card .rc-stats { font-size:11px; color:var(--dim); margin-top:4px; }

  /* Time buckets */
  .buckets { display: grid; grid-template-columns: repeat(4, 1fr);
             gap: 5px; margin-top: 8px; }
  .bucket {
    background:var(--card2); padding:6px 4px; border-radius: var(--radius-sm);
    text-align:center; font-size:11px; border:1px solid transparent;
  }
  .bucket .lab { color: var(--dim); font-size:10px; display:block; margin-bottom:2px;
                 text-transform:uppercase; letter-spacing:0.04em; }
  .bucket.worst { border-color: var(--bad); background: rgba(239,68,68,0.08); }
  .bucket.best  { border-color: var(--good); background: rgba(34,197,94,0.08); }

  /* Favorites */
  .fav-item { display:flex; justify-content:space-between; align-items:center;
              padding:12px 14px; border-radius:var(--radius-sm); cursor:pointer;
              background:var(--card); border:1px solid var(--line); margin-bottom:6px;
              min-height:44px; transition: border-color 0.15s; }
  .fav-item:hover { border-color: var(--accent); }
  .fav-item .fav-name { font-size:13px; font-weight:500; }
  .fav-item .rm { color:var(--dim); font-size:18px; line-height:1; }
  .fav-item .rm:hover { color: var(--bad); }

  /* Trip planner */
  .planner-row { display:flex; gap:8px; margin-bottom:8px; }
  .planner-row input { flex:1; padding:10px 12px; border-radius:var(--radius-sm); min-height:40px;
                       border:1px solid var(--line); background:var(--card2); color:var(--text); }
  .planner-row input:focus { border-color: var(--accent); outline:none; background:var(--panel); }
  .planner-row button { padding:10px 16px; border-radius:var(--radius-sm); border:1px solid var(--accent);
                        min-height:40px; background: var(--accent); color:var(--accent-ink);
                        font-weight:600; cursor:pointer; transition:background 0.15s; }
  .planner-row button:hover { background: var(--accent2); border-color: var(--accent2); }
  .plan-opt { background:var(--card); padding:10px 12px; border-radius:var(--radius-sm);
              border:1px solid var(--line); margin-bottom:6px; font-size:13px; }

  .muted { color:var(--muted); font-size:13px; }
  canvas { background:var(--card); border-radius:var(--radius); padding:8px;
           border:1px solid var(--line); }
  .legend { font-size:11px; color:var(--dim); margin-top:8px; }

  .offline-banner {
    background: var(--bad); color:#fff; text-align:center;
    font-size:12px; font-weight:600; padding:7px 10px; letter-spacing:0.02em;
  }

  /* Map */
  #map { background: var(--card2); }
  .leaflet-container { background: var(--card2); font-family: inherit; }
  .leaflet-control-zoom a {
    background: var(--panel) !important; color: var(--text) !important;
    border: 1px solid var(--line) !important; transition: background 0.15s;
    box-shadow: var(--shadow-sm);
  }
  .leaflet-control-zoom a:hover { background: var(--card2) !important; color: var(--accent) !important; }
  .leaflet-control-attribution {
    background: color-mix(in srgb, var(--panel) 85%, transparent) !important; color: var(--muted) !important;
    border-radius: 4px; padding: 2px 6px; font-size: 10px;
  }
  .leaflet-control-attribution a { color: var(--info) !important; }

  /* Stop markers */
  .stop-marker {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--info); border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--info), 0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .stop-marker:hover {
    transform: scale(1.4);
    box-shadow: 0 0 0 2px var(--info), 0 0 14px color-mix(in srgb, var(--info) 60%, transparent);
  }
  .stop-marker.selected {
    background: var(--accent); border-color: #fff;
    box-shadow: 0 0 0 2px var(--accent), 0 0 18px color-mix(in srgb, var(--accent) 60%, transparent);
    transform: scale(1.5);
  }
  .stop-tooltip {
    background: var(--panel) !important; color: var(--text) !important;
    border: 1px solid var(--line) !important; padding: 4px 8px !important;
    border-radius: var(--radius-sm) !important; font-size: 12px !important;
    font-weight: 500 !important; box-shadow: var(--shadow-md) !important;
  }
  .stop-tooltip::before { display:none !important; }

  /* User location marker (blue pulse, Google-Maps style) */
  .user-marker { position: relative; width: 18px; height: 18px; }
  .user-marker .core {
    position: absolute; inset: 0; width: 18px; height: 18px; border-radius: 50%;
    background: var(--info); border: 3px solid #fff;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--info) 50%, transparent), 0 2px 8px rgba(0,0,0,0.25);
    z-index: 2;
  }
  .user-marker .ring {
    position: absolute; left: -8px; top: -8px; width: 34px; height: 34px;
    border-radius: 50%; background: color-mix(in srgb, var(--info) 25%, transparent);
    animation: userPulse 2s ease-out infinite;
  }
  @keyframes userPulse {
    0%   { transform: scale(0.6); opacity: 0.9; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  /* Marker cluster restyle */
  .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
    background: color-mix(in srgb, var(--info) 20%, transparent) !important;
  }
  .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
    background: var(--info) !important; color: #fff !important;
    font-weight: 700 !important; font-size: 12px !important;
    border: 2px solid var(--panel) !important;
  }

  /* Status indicator (top of map area) */
  .map-status {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: color-mix(in srgb, var(--panel) 95%, transparent); color: var(--text); padding: 7px 16px;
    border-radius: 999px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--line); backdrop-filter: blur(8px);
    z-index: 500; pointer-events: none;
    box-shadow: var(--shadow-sm);
  }
  .map-status .count { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>Adelaide Transit</h1>
  <input id="search" placeholder="Search stop name..." />
  <button id="locate">My location</button>
  <button id="theme-toggle" title="Toggle light/dark" aria-label="Toggle light/dark theme">&#9788;</button>
</header>
<div class="offline-banner" id="offline-banner" hidden>
  Can't reach the server, retrying every 25s
</div>
<main>
  <div style="flex:1; position:relative;">
    <div id="map" style="width:100%; height:100%;"></div>
    <div class="map-status" id="status"><span class="count">0</span> stops visible · click any to see arrivals</div>
  </div>
  <aside id="panel">
    <div class="section" id="fav-section">
      <h3>Favorite stops</h3>
      <div id="favs" class="muted">No favorites yet. Star a stop to add it.</div>
    </div>
    <div class="section" id="stop-section">
      <h3>Stop details</h3>
      <div class="muted">Pick a stop to see live arrivals.</div>
    </div>
  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
// API URL: defaults to current tunnel, can be overridden at runtime via:
//   localStorage.setItem("apiUrl", "https://150-230-11-143.sslip.io")
// or via URL param: ?api=https://150-230-11-143.sslip.io
const DEFAULT_API = "https://150-230-11-143.sslip.io";
// Permanent backend is the default. ?api=... still allows a one-off override for testing.
// Clear any stale saved tunnel URL from the old setup so it can't override the default.
localStorage.removeItem("apiUrl");
const urlParam = new URLSearchParams(location.search).get("api");
const API = urlParam || DEFAULT_API;
console.log("API:", API);
const map = L.map("map", { zoomControl: true, attributionControl: true })
  .setView([-34.9285, 138.6007], 14);

// OpenStreetMap standard tiles, free, no API key required, street labels included
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const stopLayer = L.markerClusterGroup({
  maxClusterRadius: 45,
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  disableClusteringAtZoom: 17,
});
map.addLayer(stopLayer);

let currentStop = null;
let currentMarker = null;
let reliabilityChart = null;

// -------- Networking helper: centralizes offline detection --------
let isOffline = false;
function setOffline(v) {
  if (v === isOffline) return;
  isOffline = v;
  const el = document.getElementById("offline-banner");
  if (el) el.hidden = !v;
}

async function apiFetch(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    setOffline(false);
    return await r.json();
  } catch (err) {
    console.warn("API fetch failed:", url, err);
    setOffline(true);
    return null;
  }
}

function makeStopIcon(selected = false) {
  return L.divIcon({
    className: "",
    html: `<div class="stop-marker ${selected ? "selected" : ""}"></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7],
  });
}

function makeUserIcon() {
  return L.divIcon({
    className: "",
    html: `<div class="user-marker"><div class="ring"></div><div class="core"></div></div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9],
  });
}

let userMarker = null;
let userAccuracyCircle = null;
let lastKnownPosition = null;

function setUserLocation(lat, lon, accuracy) {
  lastKnownPosition = { lat, lon, accuracy };
  if (userMarker) map.removeLayer(userMarker);
  if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);
  userAccuracyCircle = L.circle([lat, lon], {
    radius: accuracy || 30, color: "#2563eb", fillColor: "#2563eb",
    fillOpacity: 0.08, weight: 1, opacity: 0.4,
  }).addTo(map);
  userMarker = L.marker([lat, lon], { icon: makeUserIcon(), zIndexOffset: 1000 })
    .addTo(map)
    .bindTooltip("You are here", { className: "stop-tooltip", direction: "top", offset: [0,-10] });
}

function watchUser() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    p => setUserLocation(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
    err => console.warn("geo:", err.message),
    { enableHighAccuracy: true, maximumAge: 10000 }
  );
}

// -------- Favorites (localStorage) --------
const FAV_KEY = "adlt_favs";
function getFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); } catch { return []; }
}
function setFavs(list) { localStorage.setItem(FAV_KEY, JSON.stringify(list)); renderFavs(); }
function isFav(id) { return getFavs().some(s => s.stop_id === id); }
function toggleFav(stop) {
  const favs = getFavs();
  const i = favs.findIndex(s => s.stop_id === stop.stop_id);
  if (i >= 0) favs.splice(i, 1);
  else favs.push({ stop_id: stop.stop_id, stop_name: stop.stop_name,
                   stop_lat: stop.stop_lat, stop_lon: stop.stop_lon });
  setFavs(favs);
}
function renderFavs() {
  const el = document.getElementById("favs");
  const favs = getFavs();
  if (!favs.length) { el.innerHTML = '<div class="muted">No favorites yet.</div>'; return; }
  el.innerHTML = favs.map(s => `
    <div class="fav-item" data-id="${s.stop_id}">
      <span class="fav-name">${s.stop_name}</span>
      <span class="rm" data-rm="${s.stop_id}">×</span>
    </div>`).join("");
  el.querySelectorAll(".fav-item").forEach(div => {
    div.addEventListener("click", e => {
      if (e.target.dataset.rm) {
        toggleFav({stop_id: e.target.dataset.rm});
      } else {
        const s = favs.find(f => f.stop_id === div.dataset.id);
        map.setView([s.stop_lat, s.stop_lon], 17);
        showArrivals(s);
      }
    });
  });
}

// -------- Map stops --------
async function loadStopsInView() {
  const c = map.getCenter();
  const stops = await apiFetch(`${API}/stops?lat=${c.lat}&lon=${c.lng}&radius_km=1.5`);
  if (!stops) return;
  stopLayer.clearLayers();
  stops.forEach(s => {
    const m = L.marker([s.stop_lat, s.stop_lon], { icon: makeStopIcon(), stopRef: s });
    m.bindTooltip(s.stop_name, { className: "stop-tooltip", direction: "top", offset: [0,-8] });
    m.on("click", () => {
      showArrivals(s);
      if (currentMarker) currentMarker.setIcon(makeStopIcon(false));
      m.setIcon(makeStopIcon(true));
      currentMarker = m;
    });
    stopLayer.addLayer(m);
  });
  document.getElementById("status").innerHTML =
    `<span class="count">${stops.length}</span> stops visible · click any to see arrivals`;
}

// -------- Formatting --------
function delayClass(sec) {
  if (sec == null) return "";
  if (sec <= 60) return "delay-on";
  if (sec <= 300) return "delay-late";
  return "delay-bad";
}
function fmtDelay(sec) {
  if (sec == null) return "no realtime data";
  const m = Math.round(sec / 60);
  if (m === 0) return "on time";
  return m > 0 ? `${m} min late` : `${Math.abs(m)} min early`;
}
function fmtTime(ts) {
  if (!ts) return "";
  return new Date(ts * 1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}
function fmtHMS(hms) { return hms ? hms.slice(0,5) : ""; }

function fmtMins(sec) {
  const m = sec / 60;
  const abs = Math.abs(m).toFixed(m % 1 === 0 ? 0 : 1);
  return m >= 0 ? `${abs} late` : `${abs} early`;
}

function classifyPattern(t) {
  if (!t) return null;
  const lo = Math.round(t.p25_sec / 60);
  const hi = Math.round(t.p75_sec / 60);
  const mid = Math.round(t.p50_sec / 60);
  let kind;
  if (lo === 0 && hi === 0)      kind = "on_time";
  else if (lo >= 0 && hi >= 0)   kind = "late";   // includes zero-to-late
  else if (lo <= 0 && hi <= 0)   kind = "early";  // includes early-to-zero
  else                            kind = "mixed";  // straddles zero
  return { lo, hi, mid, kind };
}

function patternText(t) {
  if (!t) return "Not enough history yet for this route+hour - keep collecting";
  const c = classifyPattern(t);
  const day = t.day_type === "weekend" ? "weekends" : "weekdays";
  const scopeNote = {
    "exact": `at this hour on ${day}`,
    "±1h":   `around this hour on ${day}`,
    "all-hours-day-type": `on ${day} (any hour)`,
    "all":   `overall (any hour, any day)`,
    "all-time-aggregated": `overall, from older history`,
  }[t.scope] || `on ${day}`;

  let core;
  if (c.kind === "on_time") {
    core = `Usually on time ${scopeNote}`;
  } else if (c.kind === "late") {
    if (c.lo === c.hi) {
      core = `Usually about ${c.hi} min late ${scopeNote}`;
    } else if (c.lo === 0) {
      core = `Sometimes on time, up to ${c.hi} min late ${scopeNote}`;
    } else {
      core = `Usually ${c.lo} to ${c.hi} min late ${scopeNote}`;
    }
  } else if (c.kind === "early") {
    const aLo = Math.abs(c.lo), aHi = Math.abs(c.hi);
    if (aLo === aHi) {
      core = `Usually about ${aHi} min early ${scopeNote} - leave earlier`;
    } else if (c.hi === 0) {
      core = `Sometimes on time, up to ${aLo} min early ${scopeNote} - leave earlier`;
    } else {
      core = `Usually ${aHi} to ${aLo} min early ${scopeNote} - leave earlier`;
    }
  } else {
    core = `Up to ${Math.abs(c.lo)} min early, up to ${c.hi} min late ${scopeNote}`;
  }
  return `${core} (${t.samples} samples)`;
}

function leaveByText(predicted_arrival_ts, typical, hasLiveDelay) {
  const safetyMin = 2;
  let extraBuffer = 0;
  let reason;

  if (hasLiveDelay) {
    reason = `${safetyMin} min safety buffer (live GPS is trusted)`;
  } else if (typical) {
    const c = classifyPattern(typical);
    if (c.kind === "early" || c.kind === "mixed") {
      extraBuffer = Math.max(0, -c.lo);
      reason = extraBuffer > 0
        ? `${extraBuffer} min early buffer (past pattern) + ${safetyMin} min safety`
        : `${safetyMin} min safety buffer`;
    } else {
      reason = `${safetyMin} min safety buffer (pattern says on time or late)`;
    }
  } else {
    extraBuffer = 1;
    reason = `${safetyMin + extraBuffer} min total buffer (no data yet)`;
  }

  const leaveAt = new Date(predicted_arrival_ts * 1000 - (extraBuffer + safetyMin) * 60000);
  const hh = String(leaveAt.getHours()).padStart(2,"0");
  const mm = String(leaveAt.getMinutes()).padStart(2,"0");
  return `Be at stop by ${hh}:${mm} (${reason})`;
}

function renderArrival(a) {
  const pattern = patternText(a.typical);
  const hasLive = a.has_gps === 1;
  const safetyMin = 2;

  // Status row: live dot + delay, or scheduled icon
  let statusRow;
  if (hasLive) {
    statusRow = `
      <div class="a-status">
        <span class="live-dot"></span>
        <span class="${delayClass(a.delay_seconds)}">${fmtDelay(a.delay_seconds)}</span>
        <span class="muted" style="font-size:11px;">· Live GPS</span>
      </div>`;
  } else {
    statusRow = `
      <div class="a-status">
        <span class="sched-icon">⏱</span>
        <span class="muted">Scheduled · no live GPS</span>
      </div>`;
  }

  // Leave-by hero block
  let leaveBlock = "";
  if (a.predicted_arrival) {
    let extraBuffer = 0;
    let reason;
    if (hasLive) {
      reason = "Live GPS trusted, 2 min safety";
    } else if (a.typical) {
      const c = classifyPattern(a.typical);
      if (c.kind === "early" || c.kind === "mixed") {
        extraBuffer = Math.max(0, -c.lo);
        reason = extraBuffer > 0
          ? `${extraBuffer} min early buffer + ${safetyMin} min safety`
          : `${safetyMin} min safety buffer`;
      } else {
        reason = "Pattern says on time or late, 2 min safety";
      }
    } else {
      extraBuffer = 1;
      reason = "No data yet, 3 min total buffer";
    }
    const leaveAt = new Date(a.predicted_arrival * 1000 - (extraBuffer + safetyMin) * 60000);
    const hh = String(leaveAt.getHours()).padStart(2,"0");
    const mm = String(leaveAt.getMinutes()).padStart(2,"0");
    leaveBlock = `
      <div class="a-leave">
        <div class="label">Be at stop by</div>
        <div class="time">${hh}:${mm}</div>
        <div class="reason">${reason}</div>
      </div>`;
  }

  return `
    <div class="arrival">
      <div class="a-top">
        <span class="a-route">${a.route_short_name ?? "?"}</span>
        <span class="a-headsign">${a.trip_headsign ?? ""}</span>
        <span class="a-time">${fmtTime(a.predicted_arrival)}</span>
      </div>
      ${statusRow}
      ${pattern ? `<div class="a-pattern">${pattern}</div>` : ""}
      ${leaveBlock}
    </div>`;
}

// -------- Stop panel: arrivals + reliability + planner --------
async function showArrivals(stop) {
  currentStop = stop;
  const panel = document.getElementById("stop-section");
  const starred = isFav(stop.stop_id);

  panel.innerHTML = `
    <h3>Stop details</h3>
    <div class="stop-header">
      <div class="stop-name">
        <span>${stop.stop_name}</span>
        <span class="star ${starred ? "on" : ""}" id="star-btn">★</span>
      </div>
      <div class="stop-meta">Stop ID ${stop.stop_id}</div>
    </div>

    <div class="section">
      <h3>Next arrivals</h3>
      <div id="arrivals" class="muted">loading...</div>
    </div>

    <div class="section">
      <h3>Avg delay by hour (all buses combined)</h3>
      <canvas id="reliabilityChart" height="140"></canvas>
      <div class="muted" id="reliability-note"></div>
    </div>

    <div class="section">
      <h3>Plan a trip from here</h3>
      <div class="planner-row">
        <input id="plan-to" placeholder="Destination stop name..." />
      </div>
      <div class="planner-row">
        <input id="plan-time" type="time" />
        <button id="plan-btn">Find</button>
      </div>
      <div id="plan-results" class="muted">Type a destination + arrival time.</div>
    </div>
  `;

  document.getElementById("star-btn").onclick = () => {
    toggleFav(stop);
    document.getElementById("star-btn").classList.toggle("on");
  };
  document.getElementById("plan-btn").onclick = runPlanner;

  await refreshArrivals(stop);

  // Reliability chart (fetched once per stop open, doesn't need live polling)
  const data = await apiFetch(`${API}/stop/${stop.stop_id}/reliability`);
  if (data) {
    const ctx = document.getElementById("reliabilityChart");
    if (ctx) {
    const hours = Array.from({length: 24}, (_, i) => i);
    const map = Object.fromEntries(data.by_hour.map(d => [d.hour, d.avg_delay/60]));
    const totalSamples = data.by_hour.reduce((s, d) => s + d.samples, 0);
    if (reliabilityChart) reliabilityChart.destroy();
    reliabilityChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: hours.map(h => h + "h"),
        datasets: [{
          label: "delay (minutes)",
          data: hours.map(h => map[h] ?? 0),
          backgroundColor: hours.map(h => {
            const v = map[h] ?? 0;
            if (v < -0.5) return "#3b82f6";   // early
            if (v <= 1)  return "#22c55e";   // on time
            if (v <= 5)  return "#f59e0b";   // late
            return "#ef4444";                 // very late
          }),
        }]
      },
      options: {
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: { label: c => `${c.raw.toFixed(1)} min` }
          }
        },
        scales: {
          x: { title: { display: true, text: "hour of day", color: "#94a3b8" },
               ticks: { color: "#94a3b8", maxRotation:0, autoSkip:true } },
          y: { title: { display: true, text: "minutes (− early / + late)", color: "#94a3b8" },
               ticks: { color: "#94a3b8",
                        callback: v => v + " min" } }
        }
      }
    });
    document.getElementById("reliability-note").textContent =
      `Based on ${totalSamples.toLocaleString()} samples across all buses at this stop.`;
    }
  }
}

async function refreshArrivals(stop) {
  const box = document.getElementById("arrivals");
  if (!box) return;
  const data = await apiFetch(`${API}/stop/${stop.stop_id}/next?limit=50`);
  if (!data) return;
  if (!data.arrivals.length) {
    box.innerHTML = '<div class="muted">No more buses scheduled here today.</div>';
    return;
  }
  const last = data.last_service
    ? `<div class="muted" style="margin-bottom:8px;">${data.arrivals.length} buses left today · last service ${fmtTime(data.last_service)}</div>`
    : "";
  box.innerHTML = last + data.arrivals.map(a => renderArrival(a)).join("");
}

// -------- Trip planner --------
async function runPlanner() {
  if (!currentStop) return;
  const dest = document.getElementById("plan-to").value.trim();
  const time = document.getElementById("plan-time").value;
  if (!dest) return;

  const out = document.getElementById("plan-results");
  out.innerHTML = '<div class="muted">searching...</div>';

  const matches = await apiFetch(`${API}/stops?q=${encodeURIComponent(dest)}`);
  if (!matches) { out.innerHTML = '<div class="muted">Server not reachable. Try again shortly.</div>'; return; }
  if (!matches.length) { out.innerHTML = '<div class="muted">No stop matched.</div>'; return; }
  const destStop = matches[0];

  const url = `${API}/trip/plan?from=${currentStop.stop_id}&to=${destStop.stop_id}` +
              (time ? `&arrive_by=${time}` : "");
  const data = await apiFetch(url);
  if (!data) { out.innerHTML = '<div class="muted">Server not reachable. Try again shortly.</div>'; return; }

  if (!data.options.length) {
    out.innerHTML = `<div class="muted">No direct trips from ${currentStop.stop_name}
                     to ${destStop.stop_name} before ${time || "tomorrow"}.</div>`;
    return;
  }

  out.innerHTML = `<div class="muted">→ ${destStop.stop_name}</div>` +
    data.options.map(o => {
      const delayMin = o.typical_delay_sec != null ? Math.round(o.typical_delay_sec/60) : null;
      const depHMS = fmtHMS(o.depart_at);
      // suggested "leave by" = scheduled departure minus delay (if positive)
      let leaveBy = depHMS;
      if (delayMin != null && delayMin < 0) {
        const [h,m] = depHMS.split(":").map(Number);
        const mins = h*60 + m + delayMin;
        leaveBy = `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`;
      }
      const delayTxt = delayMin == null
        ? '<span class="muted">no delay data yet for this route/hour</span>'
        : (delayMin > 0
          ? `<span class="delay-late">usually ${delayMin} min late</span>`
          : delayMin < 0
            ? `<span class="delay-bad">sometimes ${delayMin} min early, leave earlier</span>`
            : '<span class="delay-on">usually on time</span>');
      return `
        <div class="plan-opt">
          <div><span class="route" style="background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:6px;font-weight:600;">${o.route_short_name ?? o.route_id}</span>
               ${o.trip_headsign ?? ""}</div>
          <div>Depart <b>${depHMS}</b> → arrive <b>${fmtHMS(o.arrive_at)}</b></div>
          <div>${delayTxt}</div>
          <div class="leave-by">Leave by ${leaveBy}</div>
        </div>`;
    }).join("");
}

// -------- Theme toggle --------
const THEME_KEY = "adlt_theme";
function applyTheme(theme) {
  if (theme === "light" || theme === "dark") {
    document.documentElement.setAttribute("data-theme", theme);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  const isDark = theme === "dark" ||
    (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.getElementById("theme-toggle").innerHTML = isDark ? "&#9789;" : "&#9788;";
}
function toggleTheme() {
  const current = localStorage.getItem(THEME_KEY);
  const isDark = current === "dark" ||
    (current !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const next = isDark ? "light" : "dark";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}
applyTheme(localStorage.getItem(THEME_KEY));
document.getElementById("theme-toggle").addEventListener("click", toggleTheme);

// -------- Wire up --------
map.on("moveend", loadStopsInView);
loadStopsInView();
renderFavs();

// Keep the map's stop list and the open stop's arrivals fresh without
// requiring the user to pan the map or reclick the stop.
setInterval(() => {
  loadStopsInView();
  if (currentStop) refreshArrivals(currentStop);
}, 25000);

document.getElementById("search").addEventListener("change", async e => {
  const q = e.target.value.trim();
  if (!q) return;
  const stops = await apiFetch(`${API}/stops?q=${encodeURIComponent(q)}`);
  if (stops && stops[0]) { map.setView([stops[0].stop_lat, stops[0].stop_lon], 17); showArrivals(stops[0]); }
});

document.getElementById("locate").addEventListener("click", () => {
  // watchUser() has likely already reported a fix by the time the user clicks,
  // jump there instantly instead of waiting on a fresh several-second GPS read.
  if (lastKnownPosition) {
    map.setView([lastKnownPosition.lat, lastKnownPosition.lon], 17);
  }
  navigator.geolocation?.getCurrentPosition(p => {
    setUserLocation(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
    map.setView([p.coords.latitude, p.coords.longitude], 17);
  }, err => console.warn("geo:", err.message), { maximumAge: 15000 });
});

// Auto-track user location as they move
watchUser();
</script>
